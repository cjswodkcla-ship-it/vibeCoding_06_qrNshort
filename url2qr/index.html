<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 QR 코드 생성기 | Quick QR</title>
  <meta name="description" content="URL을 입력하여 간편하게 QR 코드를 생성하고 고화질 JPG 이미지로 다운로드하세요.">
  
  <!-- Google Fonts & Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <!-- 배경 데코레이션 블러 오브 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- 상단 네비게이션 / 헤더 -->
  <header class="app-header">
    <div class="logo-wrapper">
      <img src="logo.png" alt="서비스 로고" class="logo-img" id="logoImg" onerror="if(this.getAttribute('data-tried')!=='1'){this.setAttribute('data-tried','1');this.src='img/logo.png';}">
      <div class="logo-text">
        <span class="logo-title">QR Studio</span>
        <span class="logo-badge">PRO</span>
      </div>
    </div>
    <!-- 네비게이션 전환 버튼군 (QR코드 & URL단축) -->
    <nav class="nav-menu-group" aria-label="메인 기능 전환">
      <a href="index.html" class="nav-tab-btn active" id="btnNavQr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="../urlShort/index.html" class="nav-tab-btn" id="btnNavShort">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
      <a href="../index.html" class="nav-home-btn" title="허브 홈으로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
    </nav>
  </header>

  <!-- 메인 인터랙션 래퍼 -->
  <main class="main-wrapper" id="mainWrapper">
    
    <!-- 중앙 QR 코드 표시 영역 (초기에는 숨김/대기 상태) -->
    <section class="qr-stage" id="qrStage" aria-live="polite">
      <div class="qr-card-container">
        <div class="qr-glow-ring"></div>
        <div class="qr-card" id="qrCard" title="클릭하여 JPG로 다운로드">
          <div class="qr-card-header">
            <span class="qr-status-dot"></span>
            <span class="qr-url-preview" id="qrUrlPreview">https://...</span>
          </div>

          <!-- 실제 QR 코드가 렌더링될 영역 -->
          <div class="qr-display-box" id="qrDisplayBox">
            <div id="qrcode"></div>
            
            <!-- 호버 시 안내 오버레이 -->
            <div class="qr-hover-overlay">
              <div class="download-icon-box">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </div>
              <span class="overlay-text">클릭하여 JPG 다운로드</span>
            </div>
          </div>

          <div class="qr-card-footer">
            <button class="action-btn download-btn" id="btnDownloadJpg" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>JPG 이미지 저장</span>
            </button>
            <button class="action-btn copy-btn" id="btnCopyLink" type="button" title="URL 클립보드 복사">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>URL 복사</span>
            </button>
          </div>
        </div>
        <p class="qr-hint">QR 코드를 클릭하거나 다운로드 버튼을 눌러 JPG 파일로 보관하세요.</p>
      </div>
    </section>

    <!-- URL 입력 폼 영역 (초기: 정중앙 / QR 생성 후: 하단으로 부드럽게 이동) -->
    <section class="input-stage" id="inputStage">
      <div class="input-container-card">
        <div class="input-header-text" id="inputHeaderText">
          <h1 class="main-title">간편하게 만드는 나만의 QR 코드</h1>
          <p class="sub-title">웹사이트 링크, 프로필, 링크트리 등 원하는 URL을 입력해 보세요</p>
        </div>

        <form class="url-form" id="urlForm" autocomplete="off" onsubmit="return false;">
          <div class="input-pill-wrapper">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </div>
            
            <input 
              type="text" 
              id="urlInput" 
              class="url-input" 
              placeholder="예: https://naver.com 또는 instagram.com/myid" 
              aria-label="생성할 URL 입력"
              required
            >

            <button type="button" id="btnClear" class="clear-btn" aria-label="입력 내용 지우기" style="display: none;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <button type="submit" id="btnSubmit" class="submit-btn">
              <span>확인</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <div class="toast-message" id="toastMessage" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- 귀여운 인터랙티브 웰시코기 마스코트 -->
    <div class="corgi-companion" id="corgiCompanion" title="나를 클릭해봐 멍!">
      <div class="corgi-speech-bubble" id="corgiBubble">
        <span id="corgiText">멍! URL을 입력해줘 🐾</span>
      </div>
      <div class="corgi-actor" id="corgiActor">
        <div class="corgi-frame">
          <img src="corgi.jpg" alt="귀여운 웰시코기" class="corgi-img" id="corgiImg" onerror="if(this.getAttribute('data-tried')!=='1'){this.setAttribute('data-tried','1');this.src='img/corgi.jpg';}">
        </div>
        <div class="corgi-shadow"></div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
