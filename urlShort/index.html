<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 URL 단축기 | Quick Shortener</title>
  <meta name="description" content="긴 URL을 신속하고 깔끔하게 단축하세요. OpenAPI 기반 실시간 단축 및 원클릭 복사, QR코드 연동 지원.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 앰비언트 글로우 오브 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="app-header">
    <div class="logo-wrapper" id="navLogo" onclick="location.href='../index.html'" title="홈으로 이동">
      <img src="logo.png" alt="서비스 로고" class="logo-img" onerror="this.onerror=null; this.src='../url2qr/logo.png';">
      <div class="logo-text">
        <span class="logo-title">URL Studio</span>
        <span class="logo-badge">SHORT</span>
      </div>
    </div>

    <!-- 네비게이션 전환 버튼군 -->
    <nav class="nav-menu-group" aria-label="메인 기능 전환">
      <a href="../url2qr/index.html" class="nav-tab-btn" id="btnNavQr">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="index.html" class="nav-tab-btn active" id="btnNavShort">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
      <a href="../index.html" class="nav-home-btn" title="허브 홈으로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </a>
    </nav>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="main-wrapper">
    <!-- 메인 타이틀 영역 -->
    <section class="hero-section">
      <div class="service-pill-tag">
        <span class="tag-dot"></span> OpenAPI 실시간 URL 단축 서비스
      </div>
      <h1 class="main-title">긴 링크를 간결하고 깔끔하게 단축하세요</h1>
      <p class="sub-title">복잡한 긴 URL을 입력하면 순식간에 짧고 기억하기 쉬운 링크로 변환해 드립니다.</p>
    </section>

    <!-- 단축 입력 카드 영역 -->
    <section class="shortener-card-container">
      <div class="glass-card main-card">
        
        <!-- 3-1: URL 입력 폼 & 3-2: 빈 입력값 시 비활성화되는 단축하기 버튼 -->
        <form class="url-input-form" id="shortenForm" autocomplete="off" onsubmit="return false;">
          <label for="urlInput" class="form-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span>단축할 URL 입력</span>
          </label>
          
          <div class="input-row">
            <div class="input-wrapper">
              <input 
                type="text" 
                id="urlInput" 
                class="text-input" 
                placeholder="예: https://www.example.com/very/long/path/to/page?utm_source=project" 
                aria-label="단축할 URL 입력"
                required
              >
              <button type="button" id="btnClearInput" class="clear-input-btn" title="입력 지우기" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>

            <!-- 단축하기 버튼 (기본 비활성화 disabled) -->
            <button type="button" id="btnShorten" class="btn-primary" disabled>
              <span class="btn-spinner" id="btnSpinner"></span>
              <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                <path d="m8 17 4-4 4 4"></path>
                <path d="M12 13v9"></path>
              </svg>
              <span class="btn-text">단축하기</span>
            </button>
          </div>

          <!-- 상태/에러 메시지 -->
          <div class="status-message" id="statusMessage" role="status" aria-live="polite"></div>
        </form>

        <!-- 3-1 & 3-3: 단축 결과 출력 상자 및 3-4: 복사 버튼 영역 -->
        <div class="result-section" id="resultSection" style="display: none;">
          <div class="divider-line">
            <span>단축 완료 결과</span>
          </div>

          <div class="output-card">
            <div class="output-header">
              <span class="output-badge">단축 성공</span>
              <span class="compression-rate" id="compressionRate">길이 -75% 단축</span>
            </div>

            <div class="output-row">
              <!-- 읽기 전용 출력 상자 -->
              <div class="readonly-box-wrapper">
                <input 
                  type="text" 
                  id="shortenedOutput" 
                  class="readonly-output" 
                  readonly 
                  placeholder="단축된 URL이 여기에 표시됩니다"
                  aria-label="단축된 URL 결과"
                >
              </div>

              <!-- 3-4: 복사 버튼 -->
              <button type="button" id="btnCopy" class="btn-copy" title="클립보드에 복사">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>복사</span>
              </button>
            </div>

            <!-- 시너지 액션 버튼들 -->
            <div class="synergy-actions">
              <!-- 단축 URL로 QR코드 바로 만들기 -->
              <button type="button" id="btnCreateQr" class="btn-secondary" title="이 단축 URL로 QR 코드 즉시 생성">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span>QR코드로 만들기</span>
              </button>

              <!-- 새 창으로 링크 열어보기 -->
              <a href="#" id="linkOpenShort" target="_blank" rel="noopener noreferrer" class="btn-secondary link-open-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>새 탭에서 열기</span>
              </a>
            </div>
          </div>
        </div>

        <!-- 최근 단축 기록 섹션 -->
        <div class="history-section" id="historySection" style="display: none;">
          <div class="history-header">
            <span class="history-title">최근 단축 목록</span>
            <button type="button" id="btnClearHistory" class="btn-text-sm">전체 지우기</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </div>

      </div>
    </section>

    <!-- 인터랙티브 웰시코기 마스코트 -->
    <div class="corgi-companion" id="corgiCompanion" title="안녕! 나를 클릭해봐 멍!">
      <div class="corgi-speech-bubble" id="corgiBubble">
        <span id="corgiText">줄이고 싶은 긴 URL을 알려줘 🐾</span>
      </div>
      <div class="corgi-actor" id="corgiActor">
        <div class="corgi-frame">
          <img src="corgi.jpg" alt="귀여운 마스코트" class="corgi-img" onerror="this.onerror=null; this.src='../url2qr/corgi.jpg';">
        </div>
        <div class="corgi-shadow"></div>
      </div>
    </div>
  </main>

  <!-- 토스트 알림창 팝업 -->
  <div class="toast-popup" id="toastPopup" role="status" aria-live="polite">복사하였습니다</div>

  <script src="app.js"></script>
</body>
</html>
